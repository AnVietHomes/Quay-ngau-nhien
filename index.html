<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Nhân Phẩm - An Viet</title>
    <style>
        /* Khai báo font chữ */
        @font-face {
            font-family: 'Beautique Display Condensed';
            src: url('fonts/BeautiqueDisplayCondensed.ttf') format('truetype'); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Beautique Display Condensed', sans-serif;
            overflow: hidden;
        }

        /* Container ép tỷ lệ 16:9 tuyệt đối */
        .ratio-container {
            position: relative;
            width: 100vw;
            max-width: 177.78vh;
            height: 100vh;
            max-height: 56.25vw;
            background-color: #f7dcd6;
            overflow: hidden;
        }

        /* Video nền */
        .bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Lớp chứa nội dung */
        .content {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* -- KHU VỰC PHẢI (VÒNG QUAY) -- */
        .right-zone {
            position: absolute;
            right: 5%;
            top: 13%; 
            width: 55%;
            height: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            color: #8a1538;
            font-size: 4.2vw; 
            font-weight: bold;
            text-transform: uppercase;
        }

        .subtitle {
            color: #d16b7c;
            font-size: 1.4vw; 
            margin-top: 0.5vw;
            text-align: center;
        }

        .options-row {
            display: flex;
            justify-content: center;
            gap: 4vw;
            margin-top: 2vw; 
        }

        .option-item {
            position: relative;
            width: 12vw; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .option-item img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: brightness(0.35) sepia(0.8) hue-rotate(315deg) saturate(1.5);
            transition: filter 0.2s ease, transform 0.2s ease, opacity 0.3s ease;
        }

        .option-item span {
            color: #8a1538;
            font-size: 1.5vw;
            margin-top: 1.5vw;
            transition: opacity 0.2s ease;
        }

        .option-item.active {
            transform: scale(1.15);
        }
        
        .option-item.active img {
            filter: brightness(1) drop-shadow(0 0 2vw #ff7eb3);
        }

        /* Trạng thái đã hết số lượng (Ám hồng nhạt) */
        .option-item.exhausted img {
            filter: sepia(1) hue-rotate(315deg) saturate(2) brightness(0.7) !important;
            opacity: 0.3;
        }
        .option-item.exhausted span {
            opacity: 0.3;
        }

        /* Nút quay */
        #btn-spin {
            margin-top: 2.5vw; 
            padding: 1vw 4vw;
            background-color: #8a1538;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 3vw;
            font-size: 1.6vw;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0.5vw 1vw rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        #btn-spin:hover:not(:disabled) {
            background-color: #a81c45;
            transform: scale(1.05);
        }
        #btn-spin:disabled {
            background-color: #555;
            border-color: #777;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* -- KHU VỰC TRÁI (KẾT QUẢ) -- */
        .result-zone {
            position: absolute;
            left: 34%;
            top: 72%; 
            color: #8a1538;
        }

        .result-zone h3 {
            font-size: 1.4vw; 
            margin-bottom: 0.5vw;
        }

        .result-zone ul {
            list-style: none;
            font-size: 1.05vw; 
            line-height: 1.6vw;
        }

        /* -- POPUP THÔNG BÁO (HIỆU ỨNG GLASS) -- */
        .modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.show {
            opacity: 1;
            pointer-events: all;
        }
        .modal-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 3vw 5vw;
            border-radius: 1.5vw;
            text-align: center;
            box-shadow: 0 1vw 3vw rgba(0, 0, 0, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            max-width: 65vw; /* Tăng max-width để chứa đủ 2 kết quả lượt cuối */
        }
        .modal.show .modal-box {
            transform: scale(1);
        }
        
        #btn-close-modal {
            background: #8a1538;
            color: white;
            border: none;
            padding: 0.8vw 3.5vw;
            font-size: 1.3vw;
            border-radius: 2vw;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s ease;
        }
        #btn-close-modal:hover {
            background: #a81c45;
        }
    </style>
</head>
<body>

<div class="ratio-container">
    <video autoplay loop muted class="bg-video">
        <source src="back.mp4" type="video/mp4">
    </video>

    <div class="content">
        <div class="result-zone">
            <h3>DANH SÁCH KẾT QUẢ</h3>
            <ul id="list-results"></ul>
        </div>

        <div class="right-zone">
            <h1 class="title">VÒNG QUAY NHÂN PHẨM</h1>
            <p class="subtitle">Cơ hội chỉ có một, trúng cái nào nhận cái đó<br>không có cơ hội làm lại!!!</p>

            <div class="options-row">
                <div class="option-item" id="opt-3">
                    <img src="3.png" alt="Mâm đồng">
                    <span>Mâm đồng</span>
                </div>
                <div class="option-item" id="opt-2">
                    <img src="2.png" alt="Mẹt tre">
                    <span>Mẹt tre</span>
                </div>
                <div class="option-item" id="opt-1">
                    <img src="1.png" alt="Đế nhung">
                    <span>Đế nhung</span>
                </div>
            </div>

            <button id="btn-spin">KIỂM TRA NHÂN PHẨM</button>
        </div>
    </div>

    <!-- Popup -->
    <div id="result-modal" class="modal">
        <div class="modal-box">
            <!-- Vùng hiển thị nội dung động -->
            <div id="modal-content-area"></div>
            <button id="btn-close-modal">Xác nhận</button>
        </div>
    </div>
</div>

<script>
    const optionsData = [
        { id: 3, name: "Mâm đồng", maxCount: 2 },
        { id: 2, name: "Mẹt tre", maxCount: 2 },
        { id: 1, name: "Đế nhung", maxCount: 2 }
    ];

    const groups = ["Khối A1", "Khối A2", "Khối A3", "Khối A5", "Khối BO", "CNQN"];
    
    let prizePool = [];
    optionsData.forEach(opt => {
        for(let i = 0; i < opt.maxCount; i++) {
            prizePool.push(opt.id);
        }
    });

    let currentTurnIndex = 0;
    let isSpinning = false;

    const btnSpin = document.getElementById('btn-spin');
    const listResults = document.getElementById('list-results');
    const modal = document.getElementById('result-modal');
    const modalContentArea = document.getElementById('modal-content-area');
    const btnCloseModal = document.getElementById('btn-close-modal');

    // Render danh sách trống lúc đầu
    groups.forEach((group, index) => {
        const li = document.createElement('li');
        li.id = `result-${index}`;
        li.innerText = `${group}: .....`;
        listResults.appendChild(li);
    });

    btnSpin.addEventListener('click', () => {
        if(currentTurnIndex >= groups.length || isSpinning) return;
        
        isSpinning = true;
        btnSpin.disabled = true;
        
        const currentGroup = groups[currentTurnIndex];
        const availableOptions = optionsData.filter(o => o.maxCount > 0).map(o => o.id);
        
        let spinCount = 0;
        const totalSpins = 30 + Math.floor(Math.random() * 10);
        const spinSpeed = 80; 

        const interval = setInterval(() => {
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));
            
            const randomId = availableOptions[Math.floor(Math.random() * availableOptions.length)];
            document.getElementById(`opt-${randomId}`).classList.add('active');

            spinCount++;
            
            if (spinCount >= totalSpins) {
                clearInterval(interval);
                finalizeSpin(currentGroup);
            }
        }, spinSpeed);
    });

    function finalizeSpin(groupName) {
        // Kiểm tra nếu là lượt của khối BO (Index = 4) -> Bốc luôn cho cả BO và CNQN
        if (currentTurnIndex === 4) {
            // Bốc cho Khối BO
            const randomIndexBO = Math.floor(Math.random() * prizePool.length);
            const winningIdBO = prizePool[randomIndexBO];
            prizePool.splice(randomIndexBO, 1);
            
            const winningOptionBO = optionsData.find(o => o.id === winningIdBO);
            winningOptionBO.maxCount--;

            // Lúc này trong hồ chỉ còn 1 phần tử duy nhất dành cho CNQN
            const winningIdCNQN = prizePool[0];
            prizePool.splice(0, 1);
            
            const winningOptionCNQN = optionsData.find(o => o.id === winningIdCNQN);
            winningOptionCNQN.maxCount--;

            // Cập nhật Highlight mâm (sáng cả 2 mâm nếu 2 khối bốc khác nhau)
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`opt-${winningIdBO}`).classList.add('active');
            document.getElementById(`opt-${winningIdCNQN}`).classList.add('active');

            // Render giao diện Popup 2 kết quả
            const dualHtml = `
                <h2 style="font-size: 2.2vw; color: #8a1538; line-height: 1.4; margin-bottom: 2vw;">Chúc mừng 2 khối cuối cùng đã hoàn tất bốc thăm!</h2>
                <div style="display: flex; justify-content: center; gap: 6vw; margin-bottom: 2.5vw;">
                    <div style="text-align: center;">
                        <h3 style="font-size: 1.8vw; color: #8a1538; margin-bottom: 1vw;">Khối BO</h3>
                        <img src="${winningIdBO}.png" style="width: 12vw; filter: drop-shadow(0 0 1vw #ff7eb3); object-fit: contain;">
                        <p style="font-size: 1.6vw; color: #d16b7c; margin-top: 1vw; font-weight: bold;">${winningOptionBO.name}</p>
                    </div>
                    <div style="text-align: center;">
                        <h3 style="font-size: 1.8vw; color: #8a1538; margin-bottom: 1vw;">CNQN</h3>
                        <img src="${winningIdCNQN}.png" style="width: 12vw; filter: drop-shadow(0 0 1vw #ff7eb3); object-fit: contain;">
                        <p style="font-size: 1.6vw; color: #d16b7c; margin-top: 1vw; font-weight: bold;">${winningOptionCNQN.name}</p>
                    </div>
                </div>
            `;

            setTimeout(() => {
                modalContentArea.innerHTML = dualHtml;
                modal.classList.add('show');
                
                // Cập nhật text danh sách bên trái
                document.getElementById(`result-4`).innerText = `Khối BO: ${winningOptionBO.name}`;
                document.getElementById(`result-5`).innerText = `CNQN: ${winningOptionCNQN.name}`;
                
                // Quét lại toàn bộ để áp dụng trạng thái Exhausted nếu hết số lượng
                optionsData.forEach(opt => {
                    if (opt.maxCount <= 0) document.getElementById(`opt-${opt.id}`).classList.add('exhausted');
                });

                currentTurnIndex += 2; // Cộng 2 vì đã chốt 2 khối
                isSpinning = false;
            }, 600);

        } else {
            // Lượt bốc bình thường (Từ A1 -> A5)
            const randomIndex = Math.floor(Math.random() * prizePool.length);
            const winningId = prizePool[randomIndex];
            
            prizePool.splice(randomIndex, 1);
            
            const winningOption = optionsData.find(o => o.id === winningId);
            winningOption.maxCount--;

            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));
            const finalEl = document.getElementById(`opt-${winningId}`);
            finalEl.classList.add('active');

            const msg = `Chúc mừng ${groupName} đã bốc trúng lựa chọn ${winningOption.name}`;

            const singleHtml = `
                <img src="${winningId}.png" style="width: 14vw; filter: drop-shadow(0 0 1.5vw #ff7eb3); margin-bottom: 1.5vw; object-fit: contain;">
                <h2 style="font-size: 2vw; color: #8a1538; line-height: 1.4; margin-bottom: 2.5vw;">${msg}</h2>
            `;

            setTimeout(() => {
                modalContentArea.innerHTML = singleHtml;
                modal.classList.add('show');
                
                document.getElementById(`result-${currentTurnIndex}`).innerText = `${groupName}: ${winningOption.name}`;
                
                if (winningOption.maxCount <= 0) {
                    finalEl.classList.add('exhausted');
                }

                currentTurnIndex++;
                isSpinning = false;
                
            }, 600);
        }
    }

    btnCloseModal.addEventListener('click', () => {
        modal.classList.remove('show');
        
        document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));

        if (currentTurnIndex >= groups.length) {
            btnSpin.innerText = "ĐÃ HOÀN THÀNH";
            btnSpin.disabled = true;
        } else {
            btnSpin.disabled = false;
        }
    });
</script>
</body>
</html>
