<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Nhân Phẩm - An Viet</title>
    <style>
        /* Khai báo font chữ */
        @font-face {
            font-family: 'Beautique Display Condensed';
            src: url('fonts/BeautiqueDisplayCondensed.ttf') format('truetype'); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Beautique Display Condensed', sans-serif;
            overflow: hidden;
        }

        /* Container ép tỷ lệ 16:9 tuyệt đối */
        .ratio-container {
            position: relative;
            width: 100vw;
            max-width: 177.78vh;
            height: 100vh;
            max-height: 56.25vw;
            background-color: #f7dcd6;
            overflow: hidden;
        }

        /* Video nền */
        .bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Lớp chứa nội dung */
        .content {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* -- KHU VỰC PHẢI (VÒNG QUAY) -- */
        .right-zone {
            position: absolute;
            right: 5%;
            top: 10%;
            width: 55%;
            height: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            color: #8a1538;
            font-size: 3.5vw;
            font-weight: bold;
            text-transform: uppercase;
        }

        .subtitle {
            color: #d16b7c;
            font-size: 1.2vw;
            margin-top: 0.5vw;
            text-align: center;
        }

        .options-row {
            display: flex;
            justify-content: center;
            gap: 4vw;
            margin-top: 5vw;
        }

        .option-item {
            position: relative;
            width: 12vw; /* Giữ khung rộng để hiển thị mâm rõ nét */
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease;
        }

        /* Xử lý hiển thị và phủ mờ trực tiếp trên file PNG */
        .option-item img {
            width: 100%;
            height: auto;
            object-fit: contain;
            /* Phủ màu tối ám đỏ/đen tương tự #330011 */
            filter: brightness(0.35) sepia(0.8) hue-rotate(315deg) saturate(1.5);
            transition: filter 0.2s ease, transform 0.2s ease;
        }

        .option-item span {
            color: #8a1538;
            font-size: 1.5vw;
            margin-top: 1.5vw;
            transition: opacity 0.2s ease;
        }

        /* Trạng thái đang sáng (quay trúng) - Phát sáng theo viền PNG */
        .option-item.active {
            transform: scale(1.15);
        }
        .option-item.active img {
            /* Trả lại màu gốc và tạo viền sáng vàng bao quanh mâm */
            filter: brightness(1) drop-shadow(0 0 1.5vw #ffdf00);
        }

        /* Trạng thái đã hết số lượng (Tô đen tuyệt đối) */
        .option-item.exhausted img {
            filter: brightness(0) !important;
        }
        .option-item.exhausted span {
            opacity: 0.5;
        }

        /* Nút quay */
        #btn-spin {
            margin-top: 5vw;
            padding: 1vw 4vw;
            background-color: #8a1538;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 3vw;
            font-size: 1.6vw;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0.5vw 1vw rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        #btn-spin:hover:not(:disabled) {
            background-color: #a81c45;
            transform: scale(1.05);
        }
        #btn-spin:disabled {
            background-color: #555;
            border-color: #777;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* -- KHU VỰC TRÁI (KẾT QUẢ) -- */
        .result-zone {
            position: absolute;
            left: 35%;
            top: 61%;
            color: #8a1538;
        }

        .result-zone h3 {
            font-size: 1.4vw; /* Đã thu nhỏ font */
            margin-bottom: 0.5vw;
        }

        .result-zone ul {
            list-style: none;
            font-size: 1.05vw; /* Đã thu nhỏ font */
            line-height: 1.6vw;
        }

        /* -- POPUP THÔNG BÁO -- */
        .modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.show {
            opacity: 1;
            pointer-events: all;
        }
        .modal-box {
            background: #fff;
            border: 3px solid #8a1538;
            padding: 3vw 5vw;
            border-radius: 1vw;
            text-align: center;
            box-shadow: 0 0 3vw rgba(255,255,255,0.2);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .modal.show .modal-box {
            transform: scale(1);
        }
        .modal-box h2 {
            color: #8a1538;
            font-size: 2.5vw;
            margin-bottom: 2vw;
        }
        #btn-close-modal {
            background: #8a1538;
            color: white;
            border: none;
            padding: 0.8vw 3vw;
            font-size: 1.5vw;
            border-radius: 2vw;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="ratio-container">
    <video autoplay loop muted class="bg-video">
        <source src="back.mp4" type="video/mp4">
    </video>

    <div class="content">
        <!-- Danh sách kết quả -->
        <div class="result-zone">
            <h3>DANH SÁCH KẾT QUẢ</h3>
            <ul id="list-results"></ul>
        </div>

        <!-- Khu vực vòng quay -->
        <div class="right-zone">
            <h1 class="title">VÒNG QUAY NHÂN PHẨM</h1>
            <p class="subtitle">Cơ hội chỉ có một, trúng cái nào nhận cái đó<br>không có cơ hội làm lại!!!</p>

            <div class="options-row">
                <!-- Đã gỡ bỏ thẻ img-wrapper và overlay -->
                <div class="option-item" id="opt-3">
                    <img src="3.png" alt="Mâm đồng">
                    <span>Mâm đồng</span>
                </div>
                <div class="option-item" id="opt-2">
                    <img src="2.png" alt="Mẹt tre">
                    <span>Mẹt tre</span>
                </div>
                <div class="option-item" id="opt-1">
                    <img src="1.png" alt="Đế nhung">
                    <span>Đế nhung</span>
                </div>
            </div>

            <button id="btn-spin">KIỂM TRA NHÂN PHẨM</button>
        </div>
    </div>

    <!-- Popup -->
    <div id="result-modal" class="modal">
        <div class="modal-box">
            <h2 id="modal-msg">Chúc mừng ...</h2>
            <button id="btn-close-modal">Xác nhận</button>
        </div>
    </div>
</div>

<script>
    const optionsData = [
        { id: 3, name: "Mâm đồng", maxCount: 2 },
        { id: 2, name: "Mẹt tre", maxCount: 2 },
        { id: 1, name: "Đế nhung", maxCount: 2 }
    ];

    const groups = ["Khối A1", "Khối A2", "Khối A3", "Khối A5", "Khối BO", "CNQN"];
    
    let prizePool = [];
    optionsData.forEach(opt => {
        for(let i = 0; i < opt.maxCount; i++) {
            prizePool.push(opt.id);
        }
    });

    let currentTurnIndex = 0;
    let isSpinning = false;

    const btnSpin = document.getElementById('btn-spin');
    const listResults = document.getElementById('list-results');
    const modal = document.getElementById('result-modal');
    const modalMsg = document.getElementById('modal-msg');
    const btnCloseModal = document.getElementById('btn-close-modal');

    groups.forEach((group, index) => {
        const li = document.createElement('li');
        li.id = `result-${index}`;
        li.innerText = `${group}: .....`;
        listResults.appendChild(li);
    });

    btnSpin.addEventListener('click', () => {
        if(currentTurnIndex >= groups.length || isSpinning) return;
        
        isSpinning = true;
        btnSpin.disabled = true;
        
        const currentGroup = groups[currentTurnIndex];
        const availableOptions = optionsData.filter(o => o.maxCount > 0).map(o => o.id);
        
        let spinCount = 0;
        const totalSpins = 30 + Math.floor(Math.random() * 10);
        const spinSpeed = 80; 

        const interval = setInterval(() => {
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));
            
            const randomId = availableOptions[Math.floor(Math.random() * availableOptions.length)];
            document.getElementById(`opt-${randomId}`).classList.add('active');

            spinCount++;
            
            if (spinCount >= totalSpins) {
                clearInterval(interval);
                finalizeSpin(currentGroup);
            }
        }, spinSpeed);
    });

    function finalizeSpin(groupName) {
        const randomIndex = Math.floor(Math.random() * prizePool.length);
        const winningId = prizePool[randomIndex];
        
        prizePool.splice(randomIndex, 1);
        
        const winningOption = optionsData.find(o => o.id === winningId);
        winningOption.maxCount--;

        document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));
        const finalEl = document.getElementById(`opt-${winningId}`);
        finalEl.classList.add('active');

        let prefix = groupName === 'CNQN' ? 'CNQN' : groupName;
        const msg = `Chúc mừng ${prefix} đã bốc trúng lựa chọn ${winningOption.name}`;

        setTimeout(() => {
            modalMsg.innerText = msg;
            modal.classList.add('show');
            
            document.getElementById(`result-${currentTurnIndex}`).innerText = `${groupName}: ${winningOption.name}`;
            
            if (winningOption.maxCount === 0) {
                finalEl.classList.add('exhausted');
            }

            currentTurnIndex++;
            isSpinning = false;
            
        }, 600);
    }

    btnCloseModal.addEventListener('click', () => {
        modal.classList.remove('show');
        
        document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));

        if (currentTurnIndex >= groups.length) {
            btnSpin.innerText = "ĐÃ HOÀN THÀNH";
            btnSpin.disabled = true;
        } else {
            btnSpin.disabled = false;
        }
    });
</script>
</body>
</html>
